name: QA

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  e2e:
    name: Playwright E2E
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # NOT --with-deps. That flag shells out to apt-get, and on 19 Aug 2026 apt
      # hung on the runner twice in a row: the azure.archive.ubuntu.com mirror was
      # ignored and the fallback to archive.ubuntu.com stopped responding after the
      # noble-security index. Both jobs burned the full timeout and were cancelled
      # before a single test ran, which reported as a failed required check and
      # blocked every merge to main.
      #
      # The ubuntu-latest image already ships Chromium's shared libraries, so the
      # browser download alone is enough. If a missing library ever does break this,
      # it fails in seconds at browser launch rather than hanging for ten minutes.
      # The durable fix is the official container, mcr.microsoft.com/playwright:v1.59.1-noble,
      # which bakes in both deps and browsers; not taken here to keep the unblocking
      # change small and reversible.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright tests against Vercel preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
